<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto DOM</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <main>
        <section> 
            <form action="">
                <h3>Primer Ejercicio DOM</h3>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"placeholder="Ingresar nombre">

                <br>
                <input type="text" id="resultado">


                <button type="button" onclick="saludar()">Aceptar</button>
                <button type="reset">Cancelar</button>
            </form>
        </section> 
        <section>
            <h3>Segundo ejercicio DOM</h3>
            <form action="">
                    <label for="nombre2">Nombre completo:</label>
                    <input type="text" id="nombre2">
                    <label for="programa2">Programa de formacion:</label>
                    <input type="text" id="programa2">
                    <button onclick="registro()" type="button">Registro</button>
            </form>
            <h2>Resultados</h2>

            <p>Resultados en un input:</p>
            <input type="text" id="resultado11" readonly>
            <p id="resultado22">Resultado con innerText:</p>
            <p id="resultado33">Resultado con innerHTML:</p>
            <p id="resultado44">Resultado con textContent:</p>
        </section>
        <section>
            <form action="">
                <label for="valorUno">valor 1:</label>
                <input type="text" id="valorUno" placeholder="Ej: 15.8">

                <label for="valorDos">valor 2: </label>
                <input type="text" id="valorDos" placeholder="Ej: 4.25">
                <br>
                
                <button type="button" onclick="calcularOperaciones()">Calcular</button>
                <button type="reset">Cancelar</button>
            </form>
            
            <h2>Resultado</h2>

            <p> Con parseInt(): <span id="resParseInt"></span></p>
            <p> Con parseFloat(): <span id="resParseFloat"></span></p>
            <p> Con Number(): <span id="resNumber"></span></p>
            <p> Suma usando parseFloat(): <span id="resSuma"></span></p>

        </section>
    </main>

</body>
</html>
